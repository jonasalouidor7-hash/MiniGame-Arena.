name: Build MiniGame Arena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Restore Android project
        shell: bash
        run: |
          echo '' | base64 --decode > project.zip
          unzip -q project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APK
        working-directory: MiniGame-Arena-Android
        run: gradle assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MiniGame-Arena-APK
          path: MiniGame-Arena-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
